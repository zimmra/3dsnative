# During the 3DS migration, test implemented packer components with synthetic
# inputs only. Runtime builds remain local until their recipe is checked in.
# A newer-SDK shell build will be an explicit dispatch, never a paid PR job.
name: tests

on:
  pull_request:
  push:
    branches: [main, claude/3ds-ios-port]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: tests-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

jobs:
  packer-tests:
    name: 3DS container and update validation (synthetic inputs)
    runs-on: ubuntu-24.04
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/setup-python@6d4fd22b20465ccc0f7354476588e8df7c9ca0e0 # v7.1.0
        with:
          python-version: '3.14'
      - name: Validate containers, plaintext hashes and automatic update selection
        run: python -m unittest discover -s tests -v
